<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Icône Luxury Shipping Assistant">
  <defs>
    <radialGradient id="glow-ritz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="132" fill="url(#glow-ritz)"/>
  <circle cx="150" cy="150" r="112" fill="none" stroke="#00d4ff" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 7"/>

  <!-- corner brackets (identité HUD du site) -->
  <path d="M22 44 V22 H44" fill="none" stroke="#00d4ff" stroke-width="4" stroke-opacity="0.6" stroke-linecap="square"/>
  <path d="M278 256 V278 H256" fill="none" stroke="#00d4ff" stroke-width="4" stroke-opacity="0.6" stroke-linecap="square"/>

  <!-- boîte isométrique -->
  <g stroke="#00d4ff" stroke-width="4" stroke-linejoin="round" fill="none">
    <polygon points="150,92 208,122 150,152 92,122" fill="url(#face-top)"/>
    <polygon points="92,122 150,152 150,222 92,192" fill="#0d1525" fill-opacity="0.5"/>
    <polygon points="150,152 208,122 208,192 150,222" fill="#0d1525" fill-opacity="0.3"/>
  </g>

  <!-- ruban -->
  <g stroke="#ff4d6d" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M150,92 L150,222"/>
    <path d="M92,148 L208,148"/>
  </g>
  <g fill="#ff4d6d">
    <path d="M150 92 C136 80, 118 82, 122 96 C126 108, 142 104, 150 92 Z"/>
    <path d="M150 92 C164 80, 182 82, 178 96 C174 108, 158 104, 150 92 Z"/>
    <circle cx="150" cy="93" r="4.5"/>
  </g>

  <!-- étiquette prix -->
  <g transform="translate(214,178) rotate(18)">
    <path d="M0 10 L26 0 L40 12 L14 24 Z" fill="#0d1525" stroke="#ff4d6d" stroke-width="3"/>
    <circle cx="8" cy="12" r="2.6" fill="#ff4d6d"/>
    <text x="17" y="17" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ff4d6d">¥</text>
  </g>
  <path d="M196,168 L172,150" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="2 3" fill="none"/>
</svg>
