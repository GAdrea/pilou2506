<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modération commentaires — Admin | Pilou</title>
    <!-- Page privée : à ne pas indexer -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="../../assets/favicon/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <link rel="stylesheet" href="../../style.css">
    <style>
        .tab-btn.active { background: rgba(0,212,255,0.18); border-color: #00d4ff; color: #00d4ff; }
    </style>
</head>
<body class="text-slate-100 min-h-screen" style="background:#050a12">

    <div class="max-w-3xl mx-auto px-6 py-12">

        <header class="flex items-center justify-between mb-10">
            <a href="../../index.html" class="text-xl font-black">
                PI<span style="color:#00d4ff">L</span><span style="color:#ff4d6d">OU</span>
                <span class="text-xs text-slate-500 font-normal tracking-widest ml-2 align-middle">ADMIN</span>
            </a>
            <button id="logoutBtn" class="hud-btn-inline hud-btn-inline-pink" style="display:none; width:auto; padding:0.5rem 1.2rem;">Déconnexion</button>
        </header>

        <!-- Écran de connexion -->
        <section id="loginScreen" class="hud-card p-8 max-w-md mx-auto">
            <p class="hud-label mb-4">Connexion admin</p>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="hud-label" for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" required class="hud-input" autocomplete="username">
                </div>
                <div>
                    <label class="hud-label" for="loginPassword">Mot de passe</label>
                    <input type="password" id="loginPassword" required class="hud-input" autocomplete="current-password">
                </div>
                <button type="submit" class="hud-btn hud-btn-primary w-full">Se connecter</button>
                <p id="loginError" class="text-sm hidden" style="color:#ff4d6d"></p>
            </form>
        </section>

        <!-- Tableau de modération -->
        <section id="modScreen" class="hidden">
            <div class="flex gap-3 mb-8">
                <button type="button" class="tab-btn hud-btn-inline active" data-tab="pending" style="width:auto;padding:0.6rem 1.2rem;">
                    En attente <span id="pendingCount"></span>
                </button>
                <button type="button" class="tab-btn hud-btn-inline" data-tab="approved" style="width:auto;padding:0.6rem 1.2rem;">
                    Approuvés
                </button>
            </div>
            <div id="pendingList"></div>
            <div id="approvedList" class="hidden"></div>
        </section>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="../../assets/js/firebase-init.js"></script>
    <script src="moderation.js"></script>
</body>
</html>
