<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temps vécu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="dust-canvas" aria-hidden="true"></canvas>

    <main class="hud-shell">
      <a href="../../projets-web.html" class="back-link fade-in-up delay-1">&lsaquo; Portfolio</a>

      <p class="page-kicker fade-in-up delay-1"><span class="dot"></span>Projet labo &mdash; Temps vécu</p>

      <section class="hud-card">
        <div class="block fade-in-up delay-2">
          <p class="kicker">Aujourd'hui</p>
          <h2 class="full-date-now"></h2>
        </div>

        <div class="block fade-in-up delay-3">
          <p class="kicker">Compteur depuis la naissance</p>
          <h2 class="lifetime-count"></h2>
        </div>

        <div class="block block--jp fade-in-up delay-4">
          <p class="kicker">日本語</p>
          <h2 class="jptext"></h2>
        </div>

        <h3 class="birthday-message"></h3>
        <h3 class="jpbirthday-message"></h3>
      </section>
    </main>

    <script src="background.js"></script>
    <script src="script.js"></script>
  </body>
</html>
