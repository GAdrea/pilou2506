<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Calculateur d'heures supplémentaires</title>
  </head>
  <body>
    <canvas id="hud-canvas" aria-hidden="true"></canvas>

    <main class="hud-shell">
      <a href="../../projets-web.html" class="back-link fade-in-up delay-1">&lsaquo; Portfolio</a>

      <p class="page-kicker fade-in-up delay-1"><span class="dot"></span>Projet labo &mdash; Heures supplémentaires</p>

      <section class="hud-card fade-in-up delay-2">
        <h1 class="app-title">Calcul des heures supplémentaires <span class="jp-inline">/ 残業計算機</span></h1>
        <p class="app-subtitle">Fais-toi plaisir! <span class="jp-inline">/ お楽しみ</span></p>

        <form>
          <div class="field-group">
            <label class="hud-label" for="starting-time">Début <span class="jp-inline">/ 開始</span></label>
            <label for="starting-date" class="hide">Date et heures / 日付と時間</label>
            <div class="field-row">
              <input class="hud-input" type="date" id="starting-date" required />
              <input class="hud-input" type="time" id="starting-time" required />
            </div>
          </div>

          <div class="field-group">
            <label class="hud-label" for="ending-time">Fin <span class="jp-inline">/ 終了</span></label>
            <label for="ending-date" class="hide">Date et heures / 日付と時間</label>
            <div class="field-row">
              <input class="hud-input" type="date" id="ending-date" required />
              <input class="hud-input" type="time" id="ending-time" required />
            </div>
          </div>

          <div class="field-group">
            <label class="hud-label" for="actual-ending-time">Fin réelle <span class="jp-inline">/ 実労働終了</span></label>
            <label for="actual-ending-date" class="hide">Date et heures / 日付と時間</label>
            <div class="field-row">
              <input class="hud-input" type="date" id="actual-ending-date" required />
              <input class="hud-input" type="time" id="actual-ending-time" required />
            </div>
          </div>

          <button type="submit" class="hud-btn">
            Alors? Combien de temps aujourd'hui? <span class="jp-inline">/ どれぐらいかな？</span>
          </button>
        </form>

        <div class="output" aria-live="polite">
          <p class="working-hours"></p>
          <p class="result"></p>
          <p class="comment-pending"></p>
          <p class="comment"></p>
        </div>
      </section>
    </main>

    <script src="background.js"></script>
    <script src="script.js"></script>
  </body>
</html>
